<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Breed Classifier</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  #preview { max-width: 100%; max-height: 320px; display: none; margin: 1rem 0; border-radius: 8px; }
  .row { display: flex; align-items: center; gap: .5rem; margin: .35rem 0; }
  .name { width: 210px; font-size: .9rem; }
  .bar { flex: 1; background: #eee; border-radius: 4px; height: 14px; }
  .fill { background: #3b82f6; height: 100%; border-radius: 4px; }
  .pct { width: 52px; text-align: right; font-size: .9rem; }
  #error { color: #b00020; }
  #timing { color: #666; font-size: .85rem; margin-top: .8rem; }
</style>
</head>
<body>
  <h1>Pet breed classifier</h1>
  <p>Upload a photo of a cat or dog (37 breeds).</p>
  <input type="file" id="file" accept="image/*">
  <img id="preview" alt="preview">
  <div id="error"></div>
  <div id="results"></div>
  <div id="timing"></div>

<script>
const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");
const results = document.getElementById("results");
const errorBox = document.getElementById("error");
const timing = document.getElementById("timing");

fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if (!file) return;
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  results.replaceChildren();
  errorBox.textContent = "";
  timing.textContent = "Classifying...";

  const body = new FormData();
  body.append("file", file);
  try {
    const resp = await fetch("/classify", { method: "POST", body });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || "Request failed");
    render(data);
  } catch (e) {
    errorBox.textContent = e.message;
    timing.textContent = "";
  }
});

function render(data) {
  results.replaceChildren(...data.predictions.map(p => {
    const row = document.createElement("div");
    row.className = "row";
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = p.breed;
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("div");
    fill.className = "fill";
    fill.style.width = (p.probability * 100).toFixed(1) + "%";
    bar.appendChild(fill);
    const pct = document.createElement("span");
    pct.className = "pct";
    pct.textContent = (p.probability * 100).toFixed(1) + "%";
    row.append(name, bar, pct);
    return row;
  }));
  timing.textContent = `preprocess ${data.timing_ms.preprocess} ms · inference ${data.timing_ms.inference} ms`;
}
</script>
</body>
</html>
